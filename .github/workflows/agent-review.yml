name: Automated Code Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  copilot-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Copilot CLI
        uses: actions/setup-copilot@v0

      - name: Run Copilot code review agent
        run: copilot -p "Review the changes in this pull request using the code-reviewer agent" -s
        env:
          GITHUB_TOKEN: ${{ github.token }}
