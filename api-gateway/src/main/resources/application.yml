server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      globalcors:
        add-to-simple-url-handler-mapping: true

        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: lb://authService
          predicates:
            - Path=/auth/**

        - id: book-service
          uri: lb://bookService
          predicates:
            - Path=/books/**

        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/members/**

        - id: borrow-service
          uri: lb://borrow-service
          predicates:
            - Path=/borrows/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: library-management-super-secret-key-2024